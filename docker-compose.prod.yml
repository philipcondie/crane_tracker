services:
  db:
    image: postgis/postgis:18-3.6
    env_file: .env.prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    build: .
    env_file: .env.prod
    command: alembic upgrade head
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env.prod
    restart: unless-stopped
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=172.28.0.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.11.2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 172.28.0.2
    depends_on:
      - app


networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/28


volumes:
  caddy_data:
  caddy_config:
  pgdata:
